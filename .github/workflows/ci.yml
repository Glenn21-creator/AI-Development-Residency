name: CI

# Run on every push to any branch. This is the "runs on every push" the challenge asks
# for: the trigger is a push, exactly as we discussed.
on:
  push:

jobs:
  db-tests:
    name: Database tests (real allocate_cycle)
    runs-on: ubuntu-latest

    # The app lives in a subfolder, so run the npm commands from there.
    defaults:
      run:
        working-directory: week-3-hyper-budget

    # Start a throwaway Postgres database that lives only for this run, then is
    # discarded. This is the real database our tests connect to.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hyperbudget_test
        ports:
          - 5432:5432
        # Wait until Postgres is actually ready before running the tests.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Tell the tests where the throwaway database is. This is a disposable, local-to-CI
    # value, not a real secret.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hyperbudget_test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run the tests (connects to the real Postgres function)
        run: npm test
